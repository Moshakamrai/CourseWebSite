<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unity Game Development Course</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="background-blob blob1"></div>
    <div class="background-blob blob2"></div>

    <section id="hero">
        <div class="container">
            <h1>Unity Game Development Course</h1>
            <p>Transform from a beginner to creating your own 3D game in just 12 weeks!</p>
            <a href="#new-slider-section" class="cta-button">Course Details</a>
            <a href="#download" class="cta-button">Course Outline And Registration</a>
            <a href="#game" class="cta-button">Play A Game</a>
        </div>
    </section>

    <section id="new-slider-section">
        <div class="carousel-container">
            <div class="carousel-track">
                <div class="carousel-slide">
                    <img src="Section 2 static image.png" alt="First Slide Image">
                </div>
                <div class="carousel-slide">
                    <img src="Section 3 static image.png" alt="Second Slide Image">
                </div>
            </div>
            <button class="carousel-button prev" id="carousel-prev">&#10094;</button>
            <button class="carousel-button next" id="carousel-next">&#10095;</button>
        </div>
    </section>

    <section id="gif-section">
        <div class="container">
             <img src="CourseOutline.gif" alt="Course Outline GIF" class="content-gif">
        </div>
    </section>

    <section id="download">
        <div class="container">
            <h2>Get the Course Outline and Fill Out the Form</h2>
            <div class="buttons">
                <a href="Blue Illustration Game Presentation.pdf" download class="download-btn">Download Course Outline</a>
                <a href="https://docs.google.com/forms/d/e/1FAIpQLSemJPb4itcLsFIxaeSGfH11FpK4VD0eFyEx5OGDnlI5pAsLhg/viewform" class="form-btn">Registration Form</a>
            </div>
        </div>
    </section>

    <section id="game">
        <div class="container">
            <h1>Play the Game</h1>
            <div class="game-wrapper">
                <iframe src="Game/index.html" frameborder="0"></iframe>
            </div>
        </div>
    </section>

    <!-- <section id="footer-section">
        <div class="container">
            <p></p>
        </div>
    </section> -->

    <script src="script.js"></script>
</body>
</html>
